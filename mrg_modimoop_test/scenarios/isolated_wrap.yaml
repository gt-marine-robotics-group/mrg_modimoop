name: isolated_wrap
description: Shortest angular error across positive and negative 180 degrees
mode: isolated
duration_s: 2.0
warmup_s: 0.5
startup_timeout_s: 10
wall_timeout_s: 15
initial: {heading_deg: 179, speed_mps: 3.0}
targets: [{at_s: 0, heading_deg: -179}]
input: {}
parameters: {}
evaluation: {}
thresholds: {max_initial_wrapped_error_deg: 3, rudder_limit_rad: 0.785398, backwing_limit_rad: 0.349066}
