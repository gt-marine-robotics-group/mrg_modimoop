name: isolated_target_change
description: Target step changes the actual controller rudder output
mode: isolated
duration_s: 3.0
warmup_s: 0.5
startup_timeout_s: 10
wall_timeout_s: 15
initial: {heading_deg: 0, speed_mps: 3.0}
targets: [{at_s: 0, heading_deg: 0}, {at_s: 1.0, heading_deg: 30}]
input: {}
parameters: {}
evaluation: {}
thresholds: {min_rudder_change_rad: 0.05, rudder_limit_rad: 0.785398, backwing_limit_rad: 0.349066}
