[stack]
name = "mrg-microtransat"
version = "0.0.1"

[container]
base = "ros:jazzy"
package-manager = "apt"
pre-setup = [
	"touch /var/mail/ubuntu && chown ubuntu /var/mail/ubuntu && userdel -r ubuntu"
]

[system.apt]
dependencies = [
    # Core ROS2 & Simulation
    "ros-jazzy-robot-localization",
    "ros-jazzy-tf-transformations",
    "ros-jazzy-urdfdom-py",
    "ros-jazzy-xacro",
    "ros-jazzy-cv-bridge",
    "ros-jazzy-sensor-msgs-py",
    "ros-jazzy-ros-gz-sim",
    "ros-jazzy-ros-gz-bridge",
    "ros-jazzy-rosbridge-suite",
    "ros-jazzy-foxglove-bridge",

    # GUI and analysis tools
    "ros-jazzy-rviz2",
    "ros-jazzy-rqt",
    "ros-jazzy-rqt-image-view",
    "ros-jazzy-plotjuggler-ros",

    # Utilities, Vision & Build Tools
    "python3-pip",
    "python3-colcon-common-extensions",
    "python3-pytest",
    "python3-opencv",
    "libgoogle-glog-dev",
    "v4l-utils",
    "i2c-tools",
    "iputils-ping",
    "tmux",
    "tmuxp",
    "nano",
    "git",

    # ASV Sim Dependencies
    "libcgal-dev",
    "libfftw3-dev"
]

[system.pip]
break-system-packages = true
dependencies = [
    "pyserial",
    "numpy<2",
    "transforms3d",
    "pigpio",
]

[tool.colcon.dependencies]
mrg-modimoop = { version = "main" }
mrg-modimoop-controls = { server = "github.com", namespace = "gt-marine-robotics-group", name = "mrg_modimoop_control", version = "master" }
asv-wave-sim = { server = "github.com", namespace = "gt-marine-robotics-group", name = "asv_wave_sim", version = "master" }
asv-sim = { server = "github.com", namespace = "srmainwaring", name = "asv_sim", version = "main" }
lyoko = { server = "github.gatech.edu", namespace = "ASDL-Robotics", name = "lyoko", version = "modimoop-support" }
